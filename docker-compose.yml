version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mapscraperhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapscraperhub
      POSTGRES_PASSWORD: mapscraperhub_dev
      POSTGRES_DB: mapscraperhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapscraperhub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
